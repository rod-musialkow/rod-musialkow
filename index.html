<html lang="pl"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Ród Musiałków – interaktywne archiwum rodzinne</title><style>
:root{--ink:#332a21;--muted:#756a5d;--gold:#a17b43;--paper:#f8f4ea}*{box-sizing:border-box}body{margin:0;background:#e8e0d1;color:var(--ink);font-family:Georgia,serif}header{background:#302b26;color:#f7eedc;padding:28px 20px;text-align:center;border-bottom:5px solid #a17b43}header small{letter-spacing:3px;color:#d6b780}h1{font-weight:normal;font-size:clamp(30px,5vw,52px);margin:10px 0}header p{margin:0;color:#d9d0bf}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.intro{background:var(--paper);border:1px solid #d4c3a4;padding:20px 26px;line-height:1.6;box-shadow:0 3px 12px #3c2d1a14}.layout{display:block;margin-top:25px}.tree{max-width:720px;margin:auto}.wrap{transition:padding-right .2s}.wrap.panel-open{padding-right:390px}.tree{text-align:center;background:#f8f4ea;border:1px solid #d4c3a4;padding:22px}.person{display:block;margin:auto;width:min(100%,350px);background:#fffdf7;border:1px solid #bba77f;border-radius:4px;padding:13px 8px;cursor:pointer;color:var(--ink);font-family:Georgia,serif;font-size:17px;transition:.15s}.person:hover,.person.active{background:#efe0c4;border-color:#8e672e;box-shadow:0 2px 10px #0001}.person small{display:block;color:#766653;margin-top:4px;font-size:12px}.connector{height:23px;border-left:2px solid #aa8e60;width:0;margin:auto}.detail{background:#fffdf7;border-left:2px solid #c7b28c;padding:26px;position:fixed;right:0;top:0;bottom:0;width:370px;max-width:95vw;overflow-y:auto;z-index:30;box-shadow:-10px 0 30px #302b2629;transform:translateX(105%);transition:transform .23s ease}.detail.open{transform:translateX(0)}.close{float:right;border:1px solid #bba77f;background:#f8f4ea;padding:7px 11px;cursor:pointer;font-size:18px}.child-link{background:transparent;border:0;color:#74511f;font:inherit;text-align:left;text-decoration:underline;cursor:pointer;padding:2px}.child-link:hover{color:#342414}.detail h3{margin-top:25px}.detail h2{font-weight:normal;margin:0 0 10px;font-size:27px}.tag{font-size:12px;letter-spacing:1px;color:#886d45;text-transform:uppercase}.detail p{line-height:1.6}.detail ul{padding-left:21px;line-height:1.9}.main{font-weight:bold;color:#74511f}.note{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5}footer{text-align:center;padding:30px;color:#6b6256;font-size:13px}@media(max-width:900px){.wrap.panel-open{padding-right:18px}.detail{width:360px}}@media(max-width:600px){.detail{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;max-height:78vh;border-left:0;border-top:2px solid #c7b28c;transform:translateY(105%);border-radius:18px 18px 0 0}.detail.open{transform:translateY(0)}}

.detail{width:440px}.wrap.panel-open{padding-right:450px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}.action{border:1px solid #c8b695;background:#f6f0e4;border-radius:5px;padding:8px 12px;color:#594329;cursor:pointer;font-family:inherit}.action:disabled{opacity:.4;cursor:default}.relation{display:block;width:100%;text-align:left;background:#f6f0e4;border:1px solid #d9c7a7;padding:10px 12px;margin:6px 0;border-radius:5px;cursor:pointer;color:#493823;font:inherit}.relation:hover{background:#eadbc1}.relation small{display:block;color:#806e56;margin-top:3px}.detail h3{border-bottom:1px solid #e5d9c3;padding-bottom:7px}.doc{padding:12px;border:1px solid #ddcbb0;border-radius:6px;background:#faf6ed}.doc small{color:#736653}.modal{position:fixed;inset:0;background:#1d1816ba;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-inner{background:#fffdf7;width:min(960px,100%);max-height:92vh;overflow:auto;padding:22px;border-radius:8px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.preview{min-height:240px;background:#eee5d4;display:flex;align-items:center;justify-content:center;color:#786954;border:1px dashed #c5b396;overflow:auto}.preview img{max-width:100%;max-height:65vh}.field{display:block;width:100%;padding:10px;border:1px solid #d3c2a4;border-radius:4px;font:inherit;margin-top:6px}.muted{color:#796e61;font-size:13px}.chip{display:inline-block;padding:4px 7px;background:#ede1ca;font-size:12px;border-radius:4px;margin-top:7px}.topbar{display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:900px){.wrap.panel-open{padding-right:18px}}@media(max-width:600px){.modal-grid{grid-template-columns:1fr}.detail{width:100%}}

/* Panel administracyjny i czytelne kopie bezpieczeństwa */
header{position:relative}
.admin-toggle{position:absolute;right:18px;bottom:12px;border:1px solid #ad9576;background:transparent;color:#f4e6d0;border-radius:5px;padding:7px 12px;font:13px Georgia,serif;cursor:pointer}
.person-admin-tools{max-width:720px;margin:0 auto 20px;padding:17px 20px;background:#f8f3e9;border:1px solid #c9b595;box-shadow:0 3px 12px #382a1912;color:#4b392b}
.person-admin-tools[hidden]{display:none!important}
.person-admin-tools h2{font-size:19px;font-weight:normal;margin:0 0 7px}
.person-admin-tools p{font-size:13px;line-height:1.5;margin:0 0 12px}
.person-admin-actions{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.person-admin-actions label,.archive-import-label{font-size:14px;font-weight:bold;color:#624728}
.person-admin-actions input[type=file],.archive-backup input[type=file]{display:block;width:100%;max-width:100%;min-width:0;font-size:12px;padding:8px;background:#fffdf8;border:1px solid #d6c4a9;border-radius:5px}
.doc-save-area{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin:18px 0}
.doc-save-area #save-status{font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.archive-backup{padding:14px;background:#f6efe3;border:1px solid #d9c6a6;border-radius:7px;margin:15px 0}
.archive-backup h3{font-size:16px;margin:0 0 8px}
.archive-backup p{font-size:12px;line-height:1.5;margin:0 0 12px}
.archive-backup .action{display:block;white-space:normal;text-align:center;margin-bottom:13px}
.archive-import-label{display:block;margin-bottom:6px}
@media(max-width:650px){.admin-toggle{position:static;margin:8px auto 0;display:block}.person-admin-tools{margin:0 8px 15px}}

header{position:relative;z-index:3;padding:24px 20px 25px}header p{display:none}

function relation(id,role){const p=people[id];return p?`<button class="relation" data-person="${safe(id)}"><b>${safe(p.name)}</b><small>${safe(role)}</small></button>`:'';}
function openPerson(id,add=true){if(!people[id])return;if(current&&current!==id&&add)history.push(current);current=id;render();}
function closePanel(){detail.classList.remove('open');document.getElementById('wrap').classList.remove('panel-open');document.querySelectorAll('.person').forEach(b=>b.classList.remove('active'));}
function updateDetailHeaderOffset(){
 const header=document.querySelector('body > header');
 if(header)document.documentElement.style.setProperty('--family-header-height',Math.ceil(header.getBoundingClientRect().height)+'px');
}
window.addEventListener('resize',updateDetailHeaderOffset);
updateDetailHeaderOffset();
function render(){updateDetailHeaderOffset();const p=people[current],priv=!p.public,parents=p.parent_ids||[],spouses=p.spouses||[],children=p.children||[];
 document.getElementById('wrap').classList.add('panel-open');detail.classList.add('open');document.querySelectorAll('.person').forEach(b=>b.classList.toggle('active',b.dataset.person===current));
 const docs=priv?[]:(archive.documents[current]||[]);
 detail.innerHTML=`<div class="toolbar"><button class="action" id="back" ${history.length?'':'disabled'}>← Wstecz</button><button class="action" id="home">Główna linia</button><button class="action" id="close" style="margin-left:auto">×</button></div><h2>${safe(p.name)}</h2>${priv?'<p class="muted">Dane tej osoby nie są udostępniane publicznie.</p>':`<h3>Dane biograficzne</h3><p><b>Urodzenie:</b> ${fmt(p.birth)}<br><b>Śmierć:</b> ${fmt(p.death)}<br><b>Chrzest:</b> ${fmt(p.baptism)}<br><b>Pochówek:</b> ${fmt(p.burial)}</p>${p.bio?'<h3>Notatka biograficzna</h3><p>'+safe(p.bio)+'</p>':''}`}<h3>Rodzice (${parents.length})</h3>${parents.map(id=>relation(id,'Rodzic')).join('')||'<p class="muted">Brak danych</p>'}<h3>Małżonka / małżonek (${spouses.length})</h3>${spouses.map(id=>relation(id,'Małżonek')).join('')||'<p class="muted">Brak danych</p>'}<h3>Archiwum dokumentów</h3>${docs.length?docs.map((d,i)=>`<button class="relation" data-doc="${i}"><b>${safe(d.title||'Dokument')}</b><small>${(d.scans||[]).length} skan(ów)</small></button>`).join(''):'<p class="muted">Brak udostępnionych dokumentów.</p>'}<h3>Dzieci (${children.length})</h3>${children.map(id=>relation(id,'Dziecko')).join('')||'<p class="muted">Brak danych</p>'}`;
 detail.querySelector('#back').onclick=()=>{if(history.length)openPerson(history.pop(),false)};detail.querySelector('#home').onclick=()=>openPerson(chain[0]);detail.querySelector('#close').onclick=closePanel;
 detail.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));detail.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>showDocument(docs[+b.dataset.doc]));detail.scrollTop=0;
 // Firefox: wyłączamy przywracanie przewinięcia po przebudowaniu zawartości.
 requestAnimationFrame(()=>{detail.scrollTop=0;requestAnimationFrame(()=>{detail.scrollTop=0;});});
}
function showDocument(d){const scans=d.scans||[];const overlay=document.createElement('div');overlay.className='modal open';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Podgląd dokumentu');
 overlay.innerHTML=`<div class="modal-inner" style="max-height:90vh;overflow:auto"><div class="topbar"><h2>${safe(d.title||'Dokument')}</h2><button class="action" id="pub-close">Zamknij ×</button></div><div>${scans.map(s=>s.data?.startsWith('data:image/')?`<img alt="${safe(s.name)}" src="${s.data}" style="display:block;max-width:100%;max-height:75vh;object-fit:contain;margin:10px auto">`:s.data?.startsWith('data:application/pdf')?`<a href="${s.data}" target="_blank" rel="noopener">${safe(s.name)} (PDF)</a>`:'').join('')}</div><h3>Transkrypcja</h3><p style="white-space:pre-wrap">${safe(d.transcript||'Brak')}</p><h3>Tłumaczenie</h3><p style="white-space:pre-wrap">${safe(d.translation||'Brak')}</p></div>`;
 document.body.appendChild(overlay);overlay.querySelector('#pub-close').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};
}
chain.forEach((id,i)=>{const p=people[id],b=document.createElement('button');b.className='person';b.dataset.person=id;b.innerHTML=safe(p.name)+'<small>Pokolenie '+(i+1)+(p.birth?.date?' · '+safe(p.birth.date):'')+'</small>';b.onclick=()=>openPerson(id);tree.appendChild(b);if(i<chain.length-1){const d=document.createElement('div');d.className='connector';tree.appendChild(d)}});
async function loadPublic(data){if(data?.format!=='rod-musialkow-publiczne'||data.version!==1||!data.tree?.people||!data.archive?.documents)throw Error('Nieprawidłowy plik danych publicznych.');
 if(data.tree.chain.join('|')!==chain.join('|'))throw Error('Inna linia drzewa.');
 for(const id of Object.keys(people)){const p=data.tree.people[id];if(!p)throw Error('Brak osoby '+id);const dst=people[id];if(!p.public){dst.name='Osoba prywatna';dst.public=false;for(const key of ['birth','death','baptism','burial','bio'])delete dst[key];}else{for(const key of ['name','birth','death','baptism','burial','bio']){if(Object.hasOwn(p,key))dst[key]=p[key];else delete dst[key]}dst.public=true;}}
 archive={version:1,documents:{}};for(const [id,docs] of Object.entries(data.archive.documents))if(people[id]?.public&&Array.isArray(docs))archive.documents[id]=docs;
 document.querySelectorAll('#tree .person').forEach(b=>{const p=people[b.dataset.person],i=chain.indexOf(b.dataset.person);b.innerHTML=safe(p.name)+'<small>Pokolenie '+(i+1)+(p.birth?.date?' · '+safe(p.birth.date):'')+'</small>'});if(current)render();
}
// Publiczna wersja tylko do odczytu. Dane aktualizują się automatycznie po publikacji na serwerze.
if(location.protocol==='http:'||location.protocol==='https:'){
 fetch('rod_musialkow_PUBLICZNE_DANE.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw Error('Nie odnaleziono opublikowanych danych');return r.json()})
  .then(loadPublic)
  .catch(err=>console.warn('Ród Musiałków: wyświetlono bazowe dane publiczne.',err));
}
</script><script>
/* Synchronizacja wysokości galerii z rzeczywistą wysokością drzewa. */
(function(){
 function alignPortraits(){
  const tree=document.querySelector('main#wrap .tree');
  const galleries=document.querySelectorAll('main#wrap > .heritage-margin');
  if(!tree || galleries.length!==2)return;
  const height=Math.ceil(tree.getBoundingClientRect().height);
  if(height>0) galleries.forEach(g=>g.style.setProperty('height',height+'px','important'));
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',alignPortraits);
 else alignPortraits();
 window.addEventListener('resize',alignPortraits);
 if(window.ResizeObserver){
  const start=()=>{const tree=document.querySelector('main#wrap .tree');if(tree)new ResizeObserver(alignPortraits).observe(tree)};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
 }
})();
</script>
<script id="genealogy-scan-zoom-script">
(function(){
 let viewer,photo,area,scale=1,dx=0,dy=0,drag=null,oldFocus=null;
 function paint(){if(photo)photo.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`;}
 function reset(){scale=1;dx=0;dy=0;paint();}
 function zoom(factor){scale=Math.max(.2,Math.min(12,scale*factor));paint();}
 function close(){if(!viewer)return;viewer.classList.remove('active');photo.removeAttribute('src');document.body.style.overflow=viewer.dataset.prevOverflow||'';oldFocus?.focus?.();}
 function open(src,alt){if(!src)return;make();oldFocus=document.activeElement;viewer.dataset.prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';photo.src=src;photo.alt=alt||'Skan dokumentu';viewer.classList.add('active');reset();viewer.querySelector('[data-zoom-close]').focus();}
 function make(){
  if(viewer)return;
  viewer=document.createElement('div');viewer.id='genealogy-scan-viewer';viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label','Powiększenie skanu');
  viewer.innerHTML='<div class="scan-tools"><button type="button" data-zoom-out>− Pomniejsz</button><button type="button" data-zoom-in>+ Powiększ</button><button type="button" data-zoom-reset>Dopasuj</button><button type="button" data-zoom-close>Zamknij ×</button></div><div class="scan-area"><img alt="Skan dokumentu" draggable="false"></div><div class="scan-hint">Kółko myszy: powiększanie · Przeciągnij: przesuwanie · Esc: zamknij</div>';
  document.body.appendChild(viewer);photo=viewer.querySelector('img');area=viewer.querySelector('.scan-area');
  viewer.querySelector('[data-zoom-out]').onclick=()=>zoom(1/1.3);
  viewer.querySelector('[data-zoom-in]').onclick=()=>zoom(1.3);
  viewer.querySelector('[data-zoom-reset]').onclick=reset;
  viewer.querySelector('[data-zoom-close]').onclick=close;
  area.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.16:1/1.16)},{passive:false});
  area.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx,dy};area.setPointerCapture(e.pointerId);area.classList.add('dragging');});
  area.addEventListener('pointermove',e=>{if(!drag)return;dx=drag.dx+e.clientX-drag.x;dy=drag.dy+e.clientY-drag.y;paint();});
  function end(){drag=null;area.classList.remove('dragging');}
  area.addEventListener('pointerup',end);area.addEventListener('pointercancel',end);
  viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
  document.addEventListener('keydown',e=>{if(!viewer.classList.contains('active'))return;if(e.key==='Escape')close();if(e.key==='+'||e.key==='=')zoom(1.3);if(e.key==='-')zoom(1/1.3);if(e.key==='0')reset();});
 }
 document.addEventListener('click',e=>{
  const img=e.target.closest('img');
  if(!img)return;
  const container=img.closest('.modal.open, #preview, #scan-list');
  if(!container)return;
  if(!img.src || img.src.startsWith('blob:')===false && img.src.startsWith('data:image/')===false && !img.complete)return;
  e.preventDefault();e.stopImmediatePropagation();open(img.src,img.alt);
 },true);
})();
</script>
